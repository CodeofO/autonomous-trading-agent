# 압축: 화면 파일(JS·CSS·SVG·매니페스트)과 JSON.
# 백엔드가 이미 압축해 보낸 /api 응답(Content-Encoding 있음)은 nginx 가 다시 압축하지 않는다.
# 1KB 미만은 압축 이득이 없어 그대로 보낸다 (백엔드 GZipMiddleware 와 같은 기준)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  # 빌드 결과(파일 이름에 내용 해시가 붙음) — 내용이 바뀌면 이름도 바뀌므로 1년 동안 다시 확인하지 않는다.
  # 없는 파일은 index.html 로 넘기지 않고 404: 옛 화면이 지난 배포의 조각을 찾을 때 HTML 이 JS 자리에
  # 1년짜리로 캐시되지 않게 (화면은 조각을 못 받으면 한 번 새로고침한다 — src/lazyPage.ts)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # 웹 앱 매니페스트('홈 화면에 추가') — 기본 mime.types 에 없다
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  # 웹 푸시 서비스 워커 — 브라우저가 항상 새로 확인하게 (수정이 바로 반영된다)
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  # 화면 입구 — 배포하면 바로 새 조각 이름을 받도록 매번 확인(바뀌지 않았으면 304)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
