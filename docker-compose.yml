services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader-local-only}
      POSTGRES_DB: trader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://trader:${POSTGRES_PASSWORD:-trader-local-only}@db:5432/trader
      DATA_DIR: /data
      TZ: Asia/Seoul
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15173}:80"

volumes:
  pgdata:
  appdata:
